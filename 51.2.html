<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-51.2</title>
    <style>
        .div-width{
            width:100%;
        }
        .div-height{
           height:60vh;;
        }
        .bg-green{
            background:darkgreen;
        }
        
        .border-solid{
            border:10px solid black;
            margin:10px;
           
        }
        
        .border-dotted{
            border:dotted;
        }
        .center{
            display:flex;
            align-items:flex-start;
            justify-content: center;
              
        }
        .py-20{
           padding-top:20px;
           padding-bottom:20px;
        }
        .px-10{
            padding-right:10px;
            padding-left: 10px;
        }
        .txt{
          font-size:20px;
          font-weight:400px;
        }
        .para-bg{
            background:darkgreen;
        }
    </style>
</head>
<body>
    <div class="center border-solid bg-green div-width div-height">
        <p class="txt px-10 py-20 para-bg border-dotted ">Notice Board</p>
    </div>
</body>
</html>
